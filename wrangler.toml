name = "yasin"
compatibility_date = "2026-03-01"
main = "src/worker.ts"
assets = { directory = "./dist", binding = "ASSETS" }

# D1 Database binding (Uncomment & replace with your real database_id from Cloudflare D1 Dashboard)
# [[d1_databases]]
# binding = "MY_DB"
# database_name = "spideydtf-db"
# database_id = "YOUR_REAL_D1_DATABASE_UUID"

# R2 Storage Bucket (Optional, bind in Cloudflare Dashboard -> Settings -> Bindings)
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "dtftest"

